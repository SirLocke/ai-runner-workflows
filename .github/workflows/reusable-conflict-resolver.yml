name: Reusable Conflict Resolver

on:
  workflow_call:
    inputs:
      auto_push:
        description: "Whether to auto-push resolved merge commit"
        type: boolean
        default: true
        required: false
      base_branch:
        description: "Target base branch name"
        type: string
        default: "main"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    name: Conflict Resolver
    runs-on: [self-hosted, oracle-ai-runner]
    steps:
      - name: Checkout PR Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Fetch Target Base Branch
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || inputs.base_branch }}:${{ github.event.pull_request.base.ref || inputs.base_branch }}

      - name: Check Mergeability
        id: merge_check
        run: |
          git config user.name "AI Conflict Resolver Bot"
          git config user.email "ai-runner@internal"
          
          if git merge --no-commit --no-ff ${{ github.event.pull_request.base.ref || inputs.base_branch }}; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            git merge --abort || true
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          fi

      - name: Run AI Conflict Resolver
        if: steps.merge_check.outputs.has_conflicts == 'true'
        run: |
          ai-runner resolve-local --dir .

      - name: Execute Safety Guard Tests
        if: steps.merge_check.outputs.has_conflicts == 'true'
        id: test_guard
        run: |
          ai-runner detect-guard --dir . --run

      - name: Commit & Push Verified Resolution
        if: steps.merge_check.outputs.has_conflicts == 'true' && steps.test_guard.outcome == 'success' && inputs.auto_push
        run: |
          git add -A
          git commit -m "chore: auto-resolved merge conflict via local LLM"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Handle Safety Guard Failure
        if: steps.merge_check.outputs.has_conflicts == 'true' && steps.test_guard.outcome == 'failure'
        run: |
          git merge --abort || git reset --hard HEAD
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Conflict Resolution Failed Safety Guard**: Local LLM resolved markers but unit tests failed. Merge aborted."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: AI

on:
  workflow_call:
    inputs:
      auto_push:
        type: boolean
        default: true
        required: false
      mention_jules:
        type: boolean
        default: true
        required: false
      base_branch:
        type: string
        default: "main"
        required: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  resolve:
    name: Resolve
    runs-on: [self-hosted, oracle-ai-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Fetch Base
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || inputs.base_branch }}:${{ github.event.pull_request.base.ref || inputs.base_branch }}

      - name: Check Merge
        id: merge_check
        run: |
          git config user.name "AI Conflict Resolver Bot"
          git config user.email "ai-runner@internal"
          
          if git merge --no-commit --no-ff ${{ github.event.pull_request.base.ref || inputs.base_branch }}; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            git merge --abort || true
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve Conflicts
        if: steps.merge_check.outputs.has_conflicts == 'true'
        run: |
          ai-runner resolve-local --dir .

      - name: Guard Tests
        if: steps.merge_check.outputs.has_conflicts == 'true'
        id: test_guard
        run: |
          ai-runner detect-guard --dir . --run

      - name: Commit & Push
        if: steps.merge_check.outputs.has_conflicts == 'true' && steps.test_guard.outcome == 'success' && inputs.auto_push
        run: |
          git add -A
          git commit -m "chore: auto-resolved merge conflict via local LLM"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

      - name: Handle Failure
        if: steps.merge_check.outputs.has_conflicts == 'true' && steps.test_guard.outcome == 'failure'
        run: |
          git merge --abort || git reset --hard HEAD
          gh pr comment ${{ github.event.pull_request.number }} --body "⚠️ **Conflict Resolution Failed Safety Guard**: Local LLM resolved markers but unit tests failed. Merge aborted."
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  review:
    name: Review
    runs-on: [self-hosted, oracle-ai-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Fetch Base
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || inputs.base_branch }}

      - name: Review
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.mention_jules }}" = "true" ]; then
            EXTRA_ARGS="--mention-jules"
          fi
          
          ai-runner review-local \
            --dir . \
            --base origin/${{ github.event.pull_request.base.ref || inputs.base_branch }} \
            --head HEAD \
            --title "$PR_TITLE" \
            --desc "$PR_BODY" \
            $EXTRA_ARGS \
            --output "./pr_review.md"

      - name: Post Comment
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f "./pr_review.md" ]; then
            gh pr comment ${{ github.event.pull_request.number }} --body-file "./pr_review.md"
          fi

name: AI

on:
  workflow_call:
    inputs:
      mention_jules:
        type: boolean
        default: true
        required: false
      base_branch:
        type: string
        default: "main"
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review
    runs-on: [self-hosted, oracle-ai-runner]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Check Existing Review
        id: check_existing
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUM" ]; then
            echo "already_reviewed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No PR number detected. Proceeding..."
            exit 0
          fi
          
          EXISTING=$(gh api repos/${{ github.repository }}/issues/$PR_NUM/comments --jq '.[] | select(.body | contains("## 🤖 AI First-Pass")) | .id' 2>/dev/null | head -n 1)
          if [ -n "$EXISTING" ]; then
            echo "already_reviewed=true" >> $GITHUB_OUTPUT
            echo "================================================================"
            echo "ℹ️ PR #$PR_NUM already has an AI First-Pass Review (Comment ID: $EXISTING)."
            echo "⏭️ Skipping redundant re-review to keep discussion clean."
            echo "================================================================"
          else
            echo "already_reviewed=false" >> $GITHUB_OUTPUT
            echo "================================================================"
            echo "✨ No previous AI review found on PR #$PR_NUM."
            echo "🚀 Proceeding with First-Pass AI Review..."
            echo "================================================================"
          fi

      - name: Fetch Base
        if: steps.check_existing.outputs.already_reviewed != 'true'
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref || inputs.base_branch }}

      - name: Review
        if: steps.check_existing.outputs.already_reviewed != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.mention_jules }}" = "true" ]; then
            EXTRA_ARGS="--mention-jules"
          fi
          
          ai-runner review-local \
            --dir . \
            --base origin/${{ github.event.pull_request.base.ref || inputs.base_branch }} \
            --head HEAD \
            --title "$PR_TITLE" \
            --desc "$PR_BODY" \
            $EXTRA_ARGS \
            --output "./pr_review.md"

      - name: Post Comment or Report Status
        if: steps.check_existing.outputs.already_reviewed != 'true'
        run: |
          PR_NUM="${{ github.event.pull_request.number }}"
          if [ -s "./pr_review.md" ] && ! grep -q "No changes detected in diff" ./pr_review.md; then
            echo "================================================================"
            echo "📝 Posting actionable review feedback as user to PR #$PR_NUM..."
            echo "================================================================"
            USER_TOKEN=$(cat /opt/ai-runner-tools/.gh_token 2>/dev/null || GH_CONFIG_DIR=/opt/ai-runner-tools/gh_config gh auth token 2>/dev/null || GH_CONFIG_DIR=/home/ubuntu/.config/gh gh auth token 2>/dev/null || grep -m1 'oauth_token:' /home/ubuntu/.config/gh/hosts.yml 2>/dev/null | awk '{print $2}')
            if [ -z "$USER_TOKEN" ]; then
              USER_TOKEN="${{ secrets.GITHUB_TOKEN || github.token }}"
            fi
            GH_TOKEN="$USER_TOKEN" gh pr comment $PR_NUM --repo "${{ github.repository }}" --body-file "./pr_review.md"
            echo "✅ Successfully posted review comment as user with action items."
          else
            echo "================================================================"
            echo "🎉 Verdict is LGTM / No actionable changes needed."
            echo "🤫 Not posting comment to PR #$PR_NUM because code looks good and clean!"
            echo "   (This prevents unnecessary bot mentions and reaction loops)"
            echo "================================================================"
          fi
